name: kit

on:
  push:
    branches:
      - master
      - "claude/**"
      - "codex/**"
  pull_request:
    branches:
      - master
      - "claude/**"
      - "codex/**"

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Setup and release safety contracts
        run: npm run test:kit:release-contracts

      - name: Test
        run: npm test

      # Browser suites for the kit's internals stay in this repository; the
      # exported-lockfile job runs the ones customers receive.
      - name: Kit-internal browser tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:controls-docs

      # Exports the customer kit and proves its canonical typecheck/test scripts,
      # Enhance That build and update-flow merge, reusing this checkout's
      # node_modules.
      - name: Export kit and prove it
        run: node scripts/export_kit.mjs "$RUNNER_TEMP/kit-proof" --force --prove

  exported-lockfile:
    # A customer installs from the exported package-lock.json, not from this
    # repository's node_modules; install it cold and run the customer gates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The export itself needs only Node.
      - name: Export kit
        run: node scripts/export_kit.mjs "$RUNNER_TEMP/kit-export" --force

      - name: Install from the exported lockfile
        working-directory: ${{ runner.temp }}/kit-export
        run: npm ci

      - name: Customer typecheck, tests and Enhance That build
        working-directory: ${{ runner.temp }}/kit-export
        run: |
          npm run typecheck
          npm test
          npm run fx:build -- enhancer-lite

      - name: Customer browser tests
        working-directory: ${{ runner.temp }}/kit-export
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
