name: kit

on:
  push:
    branches:
      - master
      - "claude/**"
      - "codex/**"
  pull_request:
    branches:
      - master
      - "claude/**"
      - "codex/**"

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Exports the customer kit and proves it standalone (Enhancer Lite build,
      # kit unit tests, update-flow merge). The proof symlinks this checkout's
      # node_modules into the export and sets its own git identity there.
      - name: Export kit and prove it
        run: node kit/scripts/export_kit.mjs /tmp/kit-export --force --prove
